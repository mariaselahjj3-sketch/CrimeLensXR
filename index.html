const CLUES={

 3:['Clue 3: Footprints','Men\u2019s formal shoe print in the mud near the body. A second, different partial print lies under flattened grass, so two people may have been here.'],
 4:['Clue 4: Blood','Only a small patch of blood on the grass. A deep neck wound should bleed much more, so she may have been killed somewhere else.'],
 5:['Clue 5: Tyre marks','Tyre marks with crisp edges, not washed away by the rain that fell from 1:00 to 2:30 AM. The car came after the rain.']};
const REVEAL=['Cold case link found','The number 4471 on the pendant matches a missing-person file from three years ago. The field was a staged scene. This murder is linked to an older case.'];
const seen=new Set();
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c)}
function wrap(g,s,x,y,mw,lh){let l='';for(const w of s.split(' ')){const n=l?l+' '+w:w;if(g.measureText(n).width>mw&&l){g.fillText(l,x,y);y+=lh;l=w}else l=n}g.fillText(l,x,y)}
const scene=new THREE.Scene();const BG=new THREE.Color(0x0e1621);scene.background=BG;
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,50);
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.xr.enabled=true;R.xr.setReferenceSpaceType('local');document.body.appendChild(R.domElement);
const RAD=2.5,H=2.2,CY=0.1;let yaw=0,pitch=0;
let spotGroup=null,pickables=[];const loaded=[];

const note=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.62),new THREE.MeshBasicMaterial({transparent:true}));note.visible=false;note.userData.note=true;scene.add(note);
function showNote(title,body,red){note.material.map=tex(880,496,(g,w,h)=>{g.fillStyle='#0b1118';g.fillRect(0,0,w,h);g.strokeStyle=red?'#ff3b4a':'#f2b84b';g.lineWidth=6;g.strokeRect(6,6,w-12,h-12);
 g.fillStyle=red?'#ff3b4a':'#f2b84b';g.font='bold 38px Georgia';g.fillText(title,28,62);g.fillStyle='#e8eef5';g.font='30px Georgia';wrap(g,body,28,118,w-56,40);
 g.fillStyle='#8fa3b8';g.font='24px Georgia';g.fillText('Clues inspected: '+seen.size+' of 5. Pinch this card to close.',28,h-26)});note.material.needsUpdate=true;
 const p=new THREE.Vector3(),d=new THREE.Vector3();camera.getWorldPosition(p);camera.getWorldDirection(d);d.y=Math.max(Math.min(d.y,0.3),-0.3);d.normalize();
 note.position.copy(p).addScaledVector(d,1.3);note.lookAt(p);note.visible=true;if(!pickables.includes(note))pickables.unshift(note)}
function setSpot(i){const L=loaded[i];if(!L)return;if(spotGroup)scene.remove(spotGroup);spotGroup=new THREE.Group();pickables=[note];note.visible=false;
 const W=H*L.aspect,len=Math.min(W/RAD,Math.PI*1.9),t0=Math.PI-len/2;
 const t=L.tex;t.wrapS=THREE.RepeatWrapping;t.repeat.x=-1;t.offset.x=1;
 const m=new THREE.Mesh(new THREE.CylinderGeometry(RAD,RAD,H,96,1,true,t0,len),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide}));m.position.y=CY;spotGroup.add(m);
 for(const k in SPOTS[i].hot){const [px,py]=SPOTS[i].hot[k];const th=t0+(1-px/L.w)*len;const y=CY+(0.5-py/L.h)*H;
  const s=new THREE.Mesh(new THREE.PlaneGeometry(0.16,0.16),new THREE.MeshBasicMaterial({transparent:true,map:tex(128,128,(g)=>{g.fillStyle='rgba(242,184,75,0.92)';g.beginPath();g.arc(64,64,58,0,7);g.fill();g.fillStyle='#1a1a1a';g.font='bold 72px Georgia';g.textAlign='center';g.fillText(k,64,90)})}));
  s.position.set(RAD*0.97*Math.sin(th),y+0.12,RAD*0.97*Math.cos(th));s.lookAt(0,y+0.12,0);s.userData.clue=+k;spotGroup.add(s);pickables.push(s)}
 // in-scene spot buttons for headset
 SPOTS.forEach((sp,j)=>{const b=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.12),new THREE.MeshBasicMaterial({map:tex(300,72,(g,w,h)=>{g.fillStyle=j===i?'#f2b84b':'#142234';g.fillRect(0,0,w,h);g.fillStyle=j===i?'#1a1a1a':'#f2b84b';g.font='bold 30px Georgia';g.textAlign='center';g.fillText(sp.name,w/2,46)})}));
  b.position.set(-0.55+j*0.55,-0.75,-1.4);b.userData.spot=j;spotGroup.add(b);pickables.push(b)});
 scene.add(spotGroup)}
Promise.all(SPOTS.map(s=>new Promise(r=>new THREE.TextureLoader().load(s.src,t=>r({tex:t,w:t.image.width,h:t.image.height,aspect:t.image.width/t.image.height}))))).then(a=>{a.forEach((x,i)=>loaded[i]=x);setSpot(0)});
// input
const rc=new THREE.Raycaster();
function pick(o,d){rc.set(o,d);const h=rc.intersectObjects(pickables)[0];if(!h)return;const u=h.object.userData;
 if(u.note){note.visible=false;return}if(u.spot!==undefined){setSpot(u.spot);return}
 if(u.clue){seen.add(u.clue);showNote(CLUES[u.clue][0],CLUES[u.clue][1]);if(seen.size===5&&!pick.done){pick.done=true;setTimeout(()=>showNote(REVEAL[0],REVEAL[1],true),2500)}}}
[0,1].forEach(i=>{const c=R.xr.getController(i);c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-3)]),new THREE.LineBasicMaterial({color:0xf2b84b})));
 c.addEventListener('selectstart',()=>{const o=new THREE.Vector3(),q=new THREE.Quaternion();c.getWorldPosition(o);c.getWorldQuaternion(q);pick(o,new THREE.Vector3(0,0,-1).applyQuaternion(q))});scene.add(c)});
let drag=false,lx=0,ly=0,mv=0;const mouse=new THREE.Vector2();
R.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;mv=0});
addEventListener('pointermove',e=>{if(!drag||R.xr.isPresenting)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);yaw+=dx*0.004;pitch=Math.max(-1.2,Math.min(1.2,pitch+dy*0.004))});
addEventListener('pointerup',e=>{drag=false;if(mv<6&&!R.xr.isPresenting){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);camera.updateMatrixWorld();rc.setFromCamera(mouse,camera);pick(rc.ray.origin.clone(),rc.ray.direction.clone())}});
R.setAnimationLoop(()=>{if(!R.xr.isPresenting){camera.rotation.set(-pitch,-yaw,0,'YXZ')}R.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
async function enter(mode){try{const s=await navigator.xr.requestSession(mode,{optionalFeatures:['hand-tracking']});scene.background=mode==='immersive-ar'?null:BG;R.xr.setSession(s);s.addEventListener('end',()=>{scene.background=BG})}catch(e){alert('Could not start: '+e.message)}}
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok){const b=document.getElementById('vr');b.hidden=false;b.onclick=()=>enter('immersive-vr')}}).catch(()=>{});
 navigator.xr.isSessionSupported('immersive-ar').then(ok=>{if(ok){const b=document.getElementById('mr');b.hidden=false;b.onclick=()=>enter('immersive-ar')}}).catch(()=>{})}
